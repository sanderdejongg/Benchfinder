name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, apcu, zip, opcache   # keep in line with backend/Dockerfile (D28)
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      # EXEC empty: tools run directly on the runner (D28). The Makefile is at the repo root.
      - run: make -f ../Makefile EXEC= check
      - run: make -f ../Makefile EXEC= test
